name: CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: composer install --no-progress --no-interaction
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tokens:check
      - name: PHPCS
        run: composer run phpcs
      - name: PHPStan
        run: composer run phpstan
      - name: ESLint
        run: pnpm run lint
      - name: tsc
        run: pnpm run typecheck
      - name: Token compiler snapshots
        run: pnpm run tokens:test

  perf:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `pnpm run build` + `pnpm run size` were removed here. Phase 0 ships no
      # block or theme JS/CSS, so there is nothing to bundle or weigh:
      # `wp-scripts build` fails on empty plugins (ADR 0011) and `size-limit`
      # was removed rather than left half-configured. Both return when the
      # first block ships (Phase 2) — see docs/phase-2-checklist.md.

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Start wp-env
        run: pnpm wp-env start --debug
      - name: wp-env diagnostics on failure
        if: failure()
        run: |
          echo "::group::wp-env logs (all, no-watch)"
          pnpm wp-env logs all --no-watch || true
          echo "::endgroup::"
          echo "::group::docker ps -a"
          docker ps -a || true
          echo "::endgroup::"
          echo "::group::docker compose ls"
          docker compose ls || true
          echo "::endgroup::"
          echo "::group::wp-env home contents (~/.wp-env and ~/wp-env)"
          ls -laR ~/.wp-env 2>/dev/null || true
          ls -laR ~/wp-env 2>/dev/null || true
          echo "::endgroup::"

      # The seed snapshot (tools/seed/snapshot/{shop.sql,uploads.tar.gz}) is
      # generated out of band by `pnpm run seed:generate && pnpm run seed:export`
      # against a local Docker wp-env (tasks 5.2 / 5.3) and cached under this
      # key. Restore-only: nothing in CI produces it yet. On a cache miss the
      # directory stays empty and the next step fails with restore-snapshot.mjs's
      # actionable "No snapshot at ... run seed:generate then seed:export" message
      # rather than a silent nothing.
      - name: Restore seed snapshot from cache
        uses: actions/cache/restore@v4
        with:
          path: tools/seed/snapshot
          key: seed-snapshot-v1-${{ hashFiles('tools/seed/ledger-seed.php', 'tools/seed/src/**/*.php', 'tools/seed/export-snapshot.mjs') }}
      - name: Load seed snapshot into wp-env
        run: pnpm run seed:restore
      - name: Point Lighthouse at a real product page
        run: node tools/seed/lhci-url.mjs
      - name: Lighthouse CI
        run: pnpm run lhci
      - name: Playwright
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
