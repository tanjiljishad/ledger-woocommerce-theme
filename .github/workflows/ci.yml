name: CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: composer install --no-progress --no-interaction
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tokens:check
      - name: PHPCS
        run: composer run phpcs
      - name: PHPStan
        run: composer run phpstan
      - name: ESLint
        run: pnpm run lint
      - name: tsc
        run: pnpm run typecheck
      - name: Token compiler snapshots
        run: pnpm run tokens:test

  perf:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Bundle size budgets
        run: pnpm run size
      - run: pnpm wp-env start
      - name: Restore seed snapshot (cached SQL dump, not a live generate)
        run: pnpm run seed:restore
      - name: Point Lighthouse at a real product page
        run: node tools/seed/lhci-url.mjs
      - name: Lighthouse CI
        run: pnpm run lhci
      - name: Playwright
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
